depth_estimation:
  ros__parameters:
    enabled: true            # the streamer switches this via topics.enable

    topics:
      infra1: /corrected/left/image_raw
      infra2: /corrected/right/image_raw
      depth_viz: /depth_estimation/image_viz
      depth: /depth_estimation/depth
      enable: /depth_estimation/enable   # "" disables gating (always on)

    qos:
      reliable: false
      depth: 2

    camera:                  # left infra, at camera.width x camera.height
      width: 848
      height: 480
      fx: 430.793086
      fy: 430.793086
      cx: 414.830803
      cy: 244.104872
      k1: 0.0
      k2: 0.0
      p1: 0.0
      p2: 0.0
      baseline: 0.09638894907585159
      bf: 41.523693          # only used if baseline <= 0

    camera2:                 # right infra, defaults to the left camera values
      fx: 430.793086
      fy: 430.793086
      cx: 414.830803
      cy: 244.104872
      k1: 0.0
      k2: 0.0
      p1: 0.0
      p2: 0.0

    stereo:
      processing_scale: 0.5
      num_disparities: 208
      min_disparity: 0
      block_size: 7
      mode: sgbm             # sgbm | sgbm_3way | hh | hh4
      p1_scale: 8
      p2_scale: 32
      uniqueness_ratio: 10
      speckle_window_size: 100
      speckle_range: 2
      disp12_max_diff: 1
      pre_filter_cap: 31
      median_ksize: 3        # 0, 3 or 5
      sync_slop_sec: 0.02
      pad_left: true
      crop_blank_strip: false

    depth:
      min_m: 0.10
      max_m: 3.0
      colormap: jet          # jet | turbo
      publish_raw: false

    legend:
      enabled: true
      ticks: 6
      width: 84

    viz:                     # keep equal to the streamer's stream.output_*
      width: 848
      height: 480
